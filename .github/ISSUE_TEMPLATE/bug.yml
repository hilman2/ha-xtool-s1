name: Bug report
description: Something is broken or doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill in as much as you can — the
        diagnostics export and the HA logs are usually enough to track most
        problems down.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.1.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: xtool_s1 integration version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: xTool S1 firmware version
      placeholder: "(see the Firmware Version sensor)"
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs
      description: |
        Settings → System → Logs → load full log; filter for `xtool_s1`.
        Wrap the snippet in a fenced code block.
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export
      description: |
        Settings → Devices & Services → xTool S1 → ⋮ → Download diagnostics.
        Drop the JSON in here (the integration redacts the host IP and serial
        before export).
      render: json
    validations:
      required: false
