save_job:
  name: Save current job
  description: >-
    Download the current gcode from the laser and save it with
    metadata. Power, speed and laser module are extracted automatically.
  fields:
    title:
      name: Title
      description: Short name for the saved job.
      required: true
      example: "Phone stand cutout"
      selector:
        text:
    description:
      name: Description
      description: Longer description of the job.
      required: true
      example: "3 mm birch plywood, vector cut at 80% / 10 mm/s"
      selector:
        text:
          multiline: true
    material:
      name: Material
      description: Material type.
      required: true
      example: "Birch plywood"
      selector:
        text:
    thickness_mm:
      name: Thickness (mm)
      description: Material thickness in millimeters.
      required: true
      example: 3.0
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: mm
          mode: box
    device_id:
      name: Device
      description: >-
        Which xTool S1 to download from. Required when multiple
        devices are configured; auto-selected with a single device.
      required: false
      selector:
        device:
          integration: xtool_s1

start_job:
  name: Start a saved job
  description: >-
    Upload a saved job and trigger the start sequence. The laser module
    is checked automatically. After the sequence the user must press
    the physical Start button on the device. USE AT YOUR OWN RISK.
  fields:
    title:
      name: Job title
      description: Title of the saved job to start.
      required: true
      selector:
        text:
    confirm:
      name: Confirm
      description: >-
        Set to true to confirm you have reviewed the job properties
        and accept responsibility for the operation.
      required: true
      selector:
        boolean:
    device_id:
      name: Device
      description: >-
        Which xTool S1 to send the job to. Required when multiple
        devices are configured; auto-selected with a single device.
      required: false
      selector:
        device:
          integration: xtool_s1

delete_job:
  name: Delete a saved job
  description: Remove a saved job from the store.
  fields:
    title:
      name: Job title
      description: Title of the job to delete.
      required: true
      selector:
        text:
    device_id:
      name: Device
      description: >-
        Which xTool S1 the job belongs to. Required when multiple
        devices are configured; auto-selected with a single device.
      required: false
      selector:
        device:
          integration: xtool_s1

list_jobs:
  name: List saved jobs
  description: Return all saved jobs with their metadata.
  fields:
    device_id:
      name: Device
      description: >-
        Filter jobs by device. If omitted, jobs from all devices
        are returned.
      required: false
      selector:
        device:
          integration: xtool_s1
